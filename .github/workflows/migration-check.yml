name: Full manuscript migration checks
on:
  push:
    branches: [full-book-v042]
    paths: [.github/workflows/migration-check.yml]
permissions:
  contents: write
jobs:
  import-complete-book:
    if: github.ref == 'refs/heads/full-book-v042'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: full-book-v042
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install transfer cryptography
        run: python -m pip install cryptography
      - name: Generate ephemeral transfer key
        run: python tools/import_full_book.py key
      - uses: actions/upload-artifact@v7
        with:
          name: full-book-transfer-public-key
          path: ${{ runner.temp }}/book-transfer-public.pem
          retention-days: 1
      - name: Import verified complete manuscript package
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE_SHA256: 6ec6e47575efcfd28fec37ec236dd1de0c6cd36234ae1c884f6671d06b8bc9a2
        run: python tools/import_full_book.py import
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Build entire textbook strictly
        run: python -m sphinx -n -W --keep-going -b html docs _build/html
      - name: Check full-book preservation
        run: python tools/check_site.py _build/html
      - name: Commit validated textbook to migration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs tools README.md .gitignore requirements.txt requirements-conversion.txt SOURCE_MANIFEST.json VALIDATION_REPORT.json MIGRATION_REPORT.md
          if git ls-files --error-unmatch .migration/full-book-transfer.json >/dev/null 2>&1; then git rm .migration/full-book-transfer.json; fi
          git commit -m 'Import complete English v0.4.2 textbook with preservation checks'
          git push origin HEAD:full-book-v042
      - name: Upload validation report
        uses: actions/upload-artifact@v7
        with:
          name: full-book-validation
          path: |
            VALIDATION_REPORT.json
            SOURCE_MANIFEST.json
            MIGRATION_REPORT.md
          retention-days: 7
      - name: Upload complete HTML build
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html
      - name: Erase temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/book-transfer-private.pem" "$RUNNER_TEMP/full-book.zip"
